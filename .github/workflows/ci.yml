name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 matches what Nixpacks installs for the apps that consume this
      # package, so a build that passes here is a build they can install.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` also runs the `prepare` script, which is `vite build`. A broken
      # build therefore fails right here — there is no separate build step
      # afterwards because it would just repeat the same work.
      - run: npm ci

      - run: npm test
      - run: npm run typecheck
      - run: npm run lint:css
